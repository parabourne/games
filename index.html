<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>minecraft-clone</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      #app { width: 100%; height: 100%; }
      #crosshair {
        position: fixed; top: 50%; left: 50%;
        width: 4px; height: 4px; background: white;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        pointer-events: none;
        z-index: 10;
      }
      #info {
        position: fixed; bottom: 10px; left: 10px;
        color: white; font-family: monospace; font-size: 13px;
        background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 6px;
        z-index: 10;
      }
      #hotbar {
        position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 6px; z-index: 10;
      }
      .slot {
        width: 44px; height: 44px;
        background: rgba(0,0,0,0.5);
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 6px;
        display: flex; align-items: center; justify-content: center;
        font-size: 22px;
        cursor: pointer;
      }
      .slot.active { border-color: white; background: rgba(255,255,255,0.2); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="crosshair"></div>
    <div id="info">WASD - hərəkət | Space - tullanmaq | Sol klik - blok sındır | Sağ klik - blok qoy | Təkər - zoom | 1-5 - blok seç</div>
    <div id="hotbar">
      <div class="slot active" data-type="grass">🟩</div>
      <div class="slot" data-type="dirt">🟫</div>
      <div class="slot" data-type="stone">⬜</div>
      <div class="slot" data-type="wood">🪵</div>
      <div class="slot" data-type="sand">🟨</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
