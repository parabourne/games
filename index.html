<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oyunlar</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #fdf6ec 0%, #eaf4ff 50%, #eefcf3 100%);
      color: #2b2d3a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 2.4rem;
      margin: 0;
      background: linear-gradient(90deg, #ff6b6b, #f7b733, #4ecdc4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 800;
    }

    .header p {
      margin-top: 10px;
      color: #6b6f80;
      font-size: 1.05rem;
    }

    .game-list {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 900px;
    }

    .game-card {
      position: relative;
      width: 220px;
      background: #ffffff;
      border-radius: 18px;
      padding: 28px 22px;
      text-decoration: none;
      color: #2b2d3a;
      box-shadow: 0 8px 20px rgba(43, 45, 58, 0.08);
      border: 1px solid rgba(43, 45, 58, 0.06);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      overflow: hidden;
    }

    .game-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #ff6b6b, #f7b733, #4ecdc4);
    }

    .game-card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 16px 30px rgba(43, 45, 58, 0.15);
    }

    .game-icon {
      font-size: 2.6rem;
      line-height: 1;
    }

    .game-name {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .game-desc {
      font-size: 0.85rem;
      color: #8a8d9c;
    }

    .game-card.disabled {
      opacity: 0.55;
      cursor: default;
      pointer-events: none;
      border-style: dashed;
    }

    .game-card.disabled .game-desc {
      font-style: italic;
    }

    footer {
      margin-top: 60px;
      text-align: center;
      color: #8a8d9c;
      font-size: 0.9rem;
    }

    footer a {
      color: #4ecdc4;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    footer a:hover {
      color: #ff6b6b;
    }

    footer .author-line {
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🎮 Oyun Mərkəzi</h1>
    <p>Oynamaq istədiyin oyunu seç</p>
  </div>

  <div class="game-list">
    <a class="game-card" href="/minecraft.html">
      <div class="game-icon">🧱</div>
      <div class="game-name">Minecraft Clone</div>
      <div class="game-desc">Blok dünyasında yarat, tikin, sağ qal</div>
    </a>

    <div class="game-card disabled">
      <div class="game-icon">➕</div>
      <div class="game-name">Tezliklə...</div>
      <div class="game-desc">Yeni oyun burada görünəcək</div>
    </div>
  </div>

  <footer>
    <div>Hazırladı: <a href="https://github.com/parabourne" target="_blank" rel="noopener">parabourne</a></div>
    <div class="author-line">
      <a href="mailto:bybourne@gmail.com">bybourne@gmail.com</a>
    </div>
  </footer>

</body>
</html>
